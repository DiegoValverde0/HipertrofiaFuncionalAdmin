version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: gym_db
    restart: always
    environment:
      # Estos valores se cargarán desde tu archivo .env en la VPS
      MYSQL_DATABASE: ${DB_NAME:-gym_prod}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - gym_network

  app:
    build: .
    container_name: gym_app
    restart: always
    env_file: .env
    depends_on:
      - db
    # Usamos ports para que el Nginx del host pueda acceder al contenedor
    ports:
      - "8000:8000"
    volumes:
      - ./instance:/app/instance
      - ./logs:/app/logs
    networks:
      - gym_network

networks:
  gym_network:
    driver: bridge

volumes:
  mysql_data:
