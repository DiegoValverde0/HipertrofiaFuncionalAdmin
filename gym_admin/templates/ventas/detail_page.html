{% extends 'base.html' %}

{% block title %}Detalle de Venta #{{ venta.id }}{% endblock %}

{% block content %}
  <div class="max-w-4xl mx-auto space-y-6">
    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
      <div class="px-6 py-4 border-b border-slate-100 bg-slate-50">
        <h2 class="text-xl font-semibold text-slate-900">Detalle de Venta #{{ venta.id }}</h2>
      </div>
      <div class="p-6">{% include 'ventas/_detail_modal_body.html' %}</div>
      <div class="px-6 py-4 border-t border-slate-100 bg-slate-50">
        <a href="{{ url_for('ventas.list_ventas') }}" class="inline-flex items-center justify-center rounded-lg text-sm font-medium transition-colors border border-slate-200 bg-white hover:bg-slate-100 text-slate-700 px-4 h-10">Volver a la lista</a>
      </div>
    </div>
  </div>
{% endblock %}
