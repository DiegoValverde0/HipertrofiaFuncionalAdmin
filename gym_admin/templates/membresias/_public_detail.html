<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Comprobante - Membresía {{ m.id }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body{ background:#f7f7f9; }
    .container-print{ max-width:800px; margin:24px auto; }
    .controls{ margin-bottom:12px; text-align:right; }
    .receipt-wrap{ background:white; padding:16px; border:1px solid #e6e6e6; }
    /* Print rules: hide UI controls and optimise receipt for printing */
    @media print {
      /* hide the print button and any controls */
      .controls { display: none !important; }
      /* remove page background and outer spacing for a clean print */
      body { background: #fff !important; }
      .container-print { max-width: 100% !important; margin: 0 !important; padding: 0 !important; }
      .receipt-wrap { border: none !important; padding: 0 !important; box-shadow: none !important; }
      /* ensure receipt fragment uses full width and readable fonts */
      .receipt, .receipt * { color: #000 !important; }
    }
  </style>
</head>
<body>
  <div class="container container-print">
    <div class="controls">
      <button class="btn btn-primary" id="membPublicPrint">Imprimir</button>
    </div>
    <script>
      (function(){
        // If URL contains print=1 param, trigger print on load
        try{
          var params = new URLSearchParams(window.location.search);
          if(params.get('print') === '1'){
            setTimeout(function(){ window.print(); }, 300);
          }
        }catch(e){}
        var btn = document.getElementById('membPublicPrint');
        if(btn){ btn.addEventListener('click', function(){ window.print(); }); }
      })();
    </script>

    <div class="receipt-wrap">
      {% include 'membresias/_detail_print.html' %}
    </div>
  </div>
</body>
</html>
