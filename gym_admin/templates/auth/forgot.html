{% extends 'base.html' %}

{% block title %}Recuperar contraseña{% endblock %}

{% block content %}
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card shadow-sm">
        <div class="card-body">
          <h3 class="card-title mb-3">Recuperar contraseña</h3>
          <form method="post">
            <div class="mb-3">
              <label class="form-label">Correo</label>
              <input class="form-control" name="correo" required>
            </div>
            <button class="btn btn-primary">Enviar nueva contraseña</button>
            <a class="btn btn-link" href="{{ url_for('auth.login') }}">Volver</a>
          </form>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
