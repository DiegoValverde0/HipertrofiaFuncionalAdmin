{% extends 'base.html' %}
{% block title %}Productos{% endblock %}
{% block content %}
  <div class="max-w-7xl mx-auto space-y-6">
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
      <div>
        <h2 class="text-2xl font-bold text-slate-900 tracking-tight flex items-center gap-2">
          <div class="w-10 h-10 rounded-xl bg-sky-50 flex items-center justify-center text-sky-600">
            <i class="ti ti-package text-2xl"></i>
          </div>
          Catalogo de Productos
        </h2>
        <p class="text-sm text-slate-500 mt-1">Administra precios, estado y stock por sucursal.</p>
      </div>

      <div class="flex flex-col sm:flex-row gap-3 w-full sm:w-auto">
        <div class="flex items-center gap-2.5 w-full sm:w-72">
          <i class="ti ti-search text-slate-400 text-sm shrink-0"></i>
          <input id="producto-search" class="w-full h-10 pr-4 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-sky-500 focus:border-sky-500 transition-colors" placeholder="Buscar producto..." value="{{ q or '' }}">
        </div>

        <div class="flex items-center gap-2.5 shrink-0">
          <select id="producto-per-page" class="h-10 text-sm border-slate-200 rounded-xl focus:ring-sky-500 focus:border-sky-500 text-slate-700 bg-white shadow-sm cursor-pointer px-3">
            <option value="10" {% if per_page==10 %}selected{% endif %}>10/pág</option>
            <option value="25" {% if per_page==25 %}selected{% endif %}>25/pág</option>
            <option value="50" {% if per_page==50 %}selected{% endif %}>50/pág</option>
            <option value="100" {% if per_page==100 %}selected{% endif %}>100/pág</option>
          </select>
        </div>

        <a class="h-10 inline-flex items-center justify-center gap-2 px-5 bg-sky-600 hover:bg-sky-700 text-white text-sm font-medium rounded-xl transition-all duration-200 shadow-sm shadow-sky-200 focus:ring-2 focus:ring-sky-500 focus:ring-offset-2 whitespace-nowrap" href="{{ url_for('productos.create_producto') }}">
          <i class="ti ti-plus text-lg"></i> Nuevo Producto
        </a>
      </div>
    </div>

    <div id="productos-table">
      {% include 'productos/_table.html' %}
    </div>
  </div>

  <!-- Modales para ajustar stock (outside the AJAX container) -->
  <div class="modal fade" id="stockModal" tabindex="-1" aria-labelledby="stockModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content border-0 shadow-lg">
        <form method="post" id="stockForm" action="">
          <div class="modal-header bg-slate-50">
            <h5 class="modal-title" id="stockModalLabel">Ajustar Stock</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" name="sucursal_id" value="{{ sucursal_actual_id }}">
            <div class="mb-3">
              <label for="stock-cantidad" class="form-label">Cantidad</label>
              <input type="number" class="form-control" id="stock-cantidad" name="cantidad" required min="0">
            </div>
            <div class="mb-3">
              <label for="stock-operacion" class="form-label">Operacion</label>
              <select class="form-select" name="operacion" id="stock-operacion">
                <option value="sumar">Sumar al stock</option>
                <option value="restar">Restar del stock</option>
                <option value="establecer">Establecer como nuevo stock</option>
              </select>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-light text-slate-700 bg-white border border-slate-200 hover:bg-slate-100" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn btn-primary">Guardar Ajuste</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script>
    (function(){
      var filters = {
        q: '{{ q or "" }}',
        per_page: {{ per_page or 10 }},
        page: {{ page or 1 }}
      };

      var searchEl = document.getElementById('producto-search');
      var perPageEl = document.getElementById('producto-per-page');

      function loadTable(overrides) {
        if (overrides) {
          for (var k in overrides) {
            if (overrides.hasOwnProperty(k)) filters[k] = overrides[k];
          }
        }

        var url = new URL('{{ url_for("productos.list_productos") }}', window.location.origin);
        if (filters.q) url.searchParams.set('q', filters.q);
        url.searchParams.set('per_page', filters.per_page);
        url.searchParams.set('page', filters.page);
        url.searchParams.set('partial', '1');

        fetch(url.toString(), { credentials: 'same-origin', headers: { 'X-Requested-With': 'XMLHttpRequest' } })
          .then(function(res) { return res.text(); })
          .then(function(html) {
            var container = document.getElementById('productos-table');
            if (container) container.innerHTML = html;

            // Update URL bar
            try {
              var stateUrl = new URL(window.location.pathname, window.location.origin);
              if (filters.q) stateUrl.searchParams.set('q', filters.q);
              if (filters.per_page && filters.per_page != 10) stateUrl.searchParams.set('per_page', filters.per_page);
              if (filters.page && filters.page != 1) stateUrl.searchParams.set('page', filters.page);
              history.replaceState(null, '', stateUrl.toString());
            } catch(e) {}
          })
          .catch(function(err) { console.error('Error loading productos table', err); });
      }

      // Search (debounced)
      var searchTimer = null;
      if (searchEl) {
        searchEl.addEventListener('input', function(){
          clearTimeout(searchTimer);
          var val = this.value.trim();
          searchTimer = setTimeout(function(){ loadTable({ q: val, page: 1 }); }, 250);
        });
      }

      // Per-page
      if (perPageEl) {
        perPageEl.addEventListener('change', function(){
          loadTable({ per_page: parseInt(this.value), page: 1 });
        });
      }

      // Pagination click delegation
      document.body.addEventListener('click', function(e){
        var a = e.target.closest('#productos-table .page-link');
        if (!a) return;
        e.preventDefault();
        try {
          var href = a.getAttribute('href') || '';
          if (href === '#' || !href) return;
          var u = new URL(href, window.location.origin);
          var page = u.searchParams.get('page') || 1;
          loadTable({ page: parseInt(page) });
        } catch(err) {
          window.location.href = a.href;
        }
      });

      // Delegated stock adjust button handler
      document.body.addEventListener('click', function(e){
        var btn = e.target.closest('.btn-stock-adjust');
        if (!btn) return;
        var productoId = btn.dataset.productoId;
        var productoNombre = btn.dataset.productoNombre || '';
        var form = document.getElementById('stockForm');
        var label = document.getElementById('stockModalLabel');
        if (form) {
          form.action = '/productos/' + productoId + '/ajustar_stock';
        }
        if (label) {
          label.textContent = 'Ajustar Stock de ' + productoNombre;
        }
        // Reset form
        var cantInput = document.getElementById('stock-cantidad');
        if (cantInput) cantInput.value = '';
        var opSelect = document.getElementById('stock-operacion');
        if (opSelect) opSelect.value = 'sumar';

        var modal = bootstrap.Modal.getOrCreateInstance(document.getElementById('stockModal'));
        modal.show();
      });
    })();
  </script>
{% endblock %}
