{# Modal fragment para registrar pagos. Usado por AJAX en modales #}
<div class="p-4">
  <form id="payment-form" method="post" action="{{ url_for('pagos.create_pago') }}">
    {% if membresia %}
      <input type="hidden" name="membresia_id" value="{{ membresia.id }}">
    {% else %}
      <input type="hidden" name="membresia_id" id="pf-membresia-id" value="">
    {% endif %}

    <div class="space-y-4">
      {% if not membresia %}
        <label class="block text-sm font-medium text-slate-700 mb-1.5">Buscar cliente con deuda</label>
        <div class="flex items-center gap-2.5">
          <i class="ti ti-search text-slate-400 text-sm shrink-0"></i>
          <input id="m-search" type="search" autocomplete="off" class="block w-full rounded-xl border-slate-200 text-sm focus:border-brand-500 focus:ring-brand-500 transition-colors h-11 bg-slate-50 hover:bg-white" placeholder="Escribe el nombre del cliente...">
        </div>
        <div id="pf-results" class="mt-2 absolute z-10 w-full bg-white rounded-lg shadow-lg border border-slate-100"></div>
      {% else %}
        <div class="bg-brand-50 border border-brand-100 rounded-xl p-3 flex items-start">
          <div class="mr-3 text-brand-600">
            <i class="ti ti-user-check text-xl"></i>
          </div>
          <div>
            <div class="text-sm font-semibold text-slate-900">Cliente seleccionado</div>
            <div class="text-sm text-slate-700">Membresía <strong class="text-brand-600">#{{ membresia.id }}</strong> — {{ membresia.cliente.nombre }} {{ membresia.cliente.apellido }}</div>
          </div>
        </div>
      {% endif %}

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1.5">Monto a abonar (S/)</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none"><span class="text-slate-400 sm:text-sm font-medium">S/</span></div>
            <input name="monto_inicial" id="monto_inicial" type="number" step="0.01" min="0.01" required class="block w-full pl-9 rounded-xl border-slate-200 text-sm h-11 bg-slate-50" value="{{ '%.2f'|format(monto_a_pagar) if monto_a_pagar else '' }}">
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1.5">Método de Pago</label>
          <select name="metodo_pago" id="metodo_pago" class="block w-full rounded-xl border-slate-200 text-sm h-11 bg-slate-50">
            <option value="Efectivo">Efectivo</option>
            <option value="Pago QR">Pago QR</option>
            <option value="Transferencia">Transferencia</option>
            <option value="Tarjeta">Tarjeta</option>
          </select>
        </div>
      </div>

      <div class="bg-slate-50 rounded-xl border border-slate-200 p-3">
        <label class="flex items-center gap-2"><input type="checkbox" id="is_split_payment" name="is_split_payment"> <span class="text-sm">Dividir pago en múltiples métodos</span></label>
        <div id="split-payment-fields" class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-3" style="display:none;">
          <div>
            <label class="text-sm">Monto en Efectivo</label>
            <input type="number" name="monto_efectivo" id="monto_efectivo" step="0.01" class="block w-full rounded-xl border-slate-200 h-10 bg-white">
          </div>
          <div>
            <label class="text-sm">Monto en QR / Digital</label>
            <input type="number" name="monto_qr" id="monto_qr" step="0.01" class="block w-full rounded-xl border-slate-200 h-10 bg-white">
          </div>
        </div>
      </div>

      <div>
        <label class="text-sm font-medium">Comentarios (Opcional)</label>
        <textarea name="comentarios" rows="2" class="block w-full rounded-xl border-slate-200 bg-slate-50"></textarea>
      </div>

      <div class="flex justify-end gap-2 mt-3">
        <button type="button" class="btn btn-secondary" onclick="modalForm.close()">Cancelar</button>
        <button type="submit" class="btn btn-primary">Procesar Pago</button>
      </div>
    </div>
  </form>
</div>

<script>
  (function(){
    var split = document.getElementById('is_split_payment');
    if(split){
      split.addEventListener('change', function(){
        var f = document.getElementById('split-payment-fields');
        var sel = document.getElementById('metodo_pago');
        var monto = document.getElementById('monto_inicial');
        if(this.checked){
          f.style.display = 'grid';
          var total = parseFloat(monto.value) || 0;
          document.getElementById('monto_efectivo').value = (total/2).toFixed(2);
          document.getElementById('monto_qr').value = (total/2).toFixed(2);
        } else {
          f.style.display = 'none';
          document.getElementById('monto_efectivo').value = '';
          document.getElementById('monto_qr').value = '';
        }
      });
    }

    // búsqueda simple para asignar membresia cuando no viene preseleccionada
    var input = document.getElementById('m-search');
    if(input){
      var results = document.getElementById('pf-results');
      var timer = null;
      input.addEventListener('input', function(){
        clearTimeout(timer);
        var q = this.value.trim();
        timer = setTimeout(function(){
          if(!q){ results.innerHTML=''; return; }
          fetch('/pagos/search_membresias?q='+encodeURIComponent(q))
            .then(r=>r.json())
            .then(data=>{
              var html = '<div class="divide-y divide-slate-100 max-h-60 overflow-auto">';
              if(data.length===0) html += '<div class="px-4 py-3 text-sm text-slate-500">No se encontraron</div>';
              data.forEach(function(it){
                html += '<a href="#" data-id="'+it.id+'" class="block px-4 py-3 hover:bg-slate-50 assign-m">';
                html += '<div class="text-sm font-semibold">'+it.cliente_nombre+'</div>';
                html += '<div class="text-xs text-slate-500">Plan: '+(it.plan||'')+' • Pendiente: S/ '+(it.pendiente||0)+'</div>';
                html += '</a>';
              });
              html += '</div>';
              results.innerHTML = html;
              results.querySelectorAll('.assign-m').forEach(function(a){
                a.addEventListener('click', function(ev){ ev.preventDefault(); var id = this.getAttribute('data-id'); document.getElementById('pf-membresia-id').value = id; results.innerHTML = ''; input.value = ''; });
              });
            });
        }, 250);
      });
    }
  })();
</script>
