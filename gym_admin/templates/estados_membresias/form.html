{% extends 'base.html' %}

{% block title %}Estado de Membresía{% endblock %}

{% block content %}
  <div class="max-w-2xl mx-auto">
    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-6">
      <h2 class="text-2xl font-bold text-slate-900 tracking-tight mb-1">{{ 'Editar' if estado else 'Crear' }} estado</h2>
      <p class="text-sm text-slate-500 mb-6">Define un nombre claro y único para el estado de membresía.</p>

      <form method="post" class="confirm-edit space-y-6">
        {% if estado %}<input type="hidden" name="id" value="{{ estado.id }}">{% endif %}
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Nombre</label>
          <input class="h-10 w-full rounded-lg border border-slate-300 px-3 text-sm shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" name="nombre" value="{{ estado.nombre if estado else '' }}" required>
        </div>

        <div class="flex items-center gap-2 pt-2">
          <button class="h-10 inline-flex items-center justify-center rounded-lg bg-indigo-600 px-4 text-sm font-semibold text-white hover:bg-indigo-700 transition-colors" type="submit">
            Guardar
          </button>
          <a class="h-10 inline-flex items-center justify-center rounded-lg border border-slate-300 bg-white px-4 text-sm font-medium text-slate-700 hover:bg-slate-100 transition-colors" href="{{ url_for('estados_membresias.list_estados') }}">
            Cancelar
          </a>
        </div>
      </form>
    </div>
  </div>
{% endblock %}
