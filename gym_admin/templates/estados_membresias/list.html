{% extends 'base.html' %}

{% block title %}Estados de Membresía{% endblock %}

{% block content %}
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Estados de Membresía</h2>
    <a class="btn btn-primary" href="{{ url_for('estados_membresias.create_estado') }}">Nuevo estado</a>
  </div>
  <table class="table table-hover">
    <thead><tr><th>Nombre</th><th>Acciones</th></tr></thead>
    <tbody>
      {% for e in estados %}
      <tr>
        <td>{{ e.nombre }}</td>
        <td>
          {% if current_user and current_user.rol_id == 1 %}
            <a class="btn btn-sm btn-outline-secondary" href="{{ url_for('estados_membresias.edit_estado', estado_id=e.id) }}">Editar</a>
            <form method="post" action="{{ url_for('estados_membresias.delete_estado', estado_id=e.id) }}" class="d-inline-block ms-2 confirm-delete-form" data-name="{{ e.nombre }}">
              <button class="btn btn-sm btn-outline-danger">Eliminar</button>
            </form>
          {% else %}
            <span class="text-muted">—</span>
          {% endif %}
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
{% endblock %}
