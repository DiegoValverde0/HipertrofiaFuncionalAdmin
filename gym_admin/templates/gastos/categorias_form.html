{% extends 'base.html' %}
{% block title %}Crear categoría{% endblock %}
{% block content %}
  <h2>Crear categoría</h2>
  <form method="post" class="confirm-edit">
    {% if categoria %}<input type="hidden" name="id" value="{{ categoria.id }}">{% endif %}
    <div class="mb-3"><label>Nombre</label><input name="nombre" class="form-control"></div>
    <button class="btn btn-primary">Guardar</button>
  </form>
{% endblock %}
