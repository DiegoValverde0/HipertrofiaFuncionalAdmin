{% extends 'base.html' %}

{% block title %}Cuentas{% endblock %}

{% block content %}
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Cuentas</h2>
    <a class="btn btn-primary" href="{{ url_for('gastos.cuentas_create') }}">Nueva cuenta</a>
  </div>
  <table class="table">
    <thead><tr><th>Nombre</th><th>Acciones</th></tr></thead>
    <tbody>
      {% for c in cuentas %}
        <tr><td>{{ c.nombre }}</td><td>
          {% if current_user and current_user.rol_id == 1 %}
            <form method="post" action="{{ url_for('gastos.cuentas_delete', cuenta_id=c.id) }}" style="display:inline" class="confirm-delete-form" data-name="{{ c.nombre }}"><button class="btn btn-sm btn-outline-danger">Eliminar</button></form>
          {% else %}
            <span class="text-muted">—</span>
          {% endif %}
        </td></tr>
      {% endfor %}
    </tbody>
  </table>
{% endblock %}
