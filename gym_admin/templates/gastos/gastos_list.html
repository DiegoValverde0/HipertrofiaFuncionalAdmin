{% extends 'base.html' %}

{% block title %}Gastos{% endblock %}

{% block content %}
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Gastos</h2>
    <div>
  <a class="btn btn-secondary me-2" id="export-gastos-csv" href="#">Exportar CSV</a>
  <a class="btn btn-secondary me-2" id="print-gastos-view" href="#">Imprimir</a>
      <a class="btn btn-primary" href="{{ url_for('gastos.gastos_create') }}">Nuevo gasto</a>
    </div>
  </div>

  <form id="gastos-filters" class="row g-2 mb-3" method="get" onsubmit="return false;">
    <div class="col-md-3"><input name="q" value="{{ q or '' }}" class="form-control" placeholder="Descripción..."></div>
    <div class="col-md-2">
      <select name="categoria" class="form-select">
        <option value="">Todas las categorías</option>
        {% for c in categorias %}
          <option value="{{ c.id }}" {% if categoria and categoria==c.id %}selected{% endif %}>{{ c.nombre }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="col-md-2">
      <select name="cuenta" class="form-select">
        <option value="">Todas las cuentas</option>
        {% for c in cuentas %}
          <option value="{{ c.id }}" {% if cuenta and cuenta==c.id %}selected{% endif %}>{{ c.nombre }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="col-md-2">
      <select name="usuario" class="form-select">
        <option value="">Todos los usuarios</option>
        {% for u in usuarios %}
          <option value="{{ u.id }}" {% if usuario and usuario==u.id %}selected{% endif %}>{{ u.nombre or u.correo }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="col-md-3 d-flex gap-2">
      <select name="periodo" class="form-select w-auto">
        <option value="">Periodo</option>
        <option value="day" {% if periodo=='day' %}selected{% endif %}>Día</option>
        <option value="week" {% if periodo=='week' %}selected{% endif %}>Semana</option>
        <option value="month" {% if periodo=='month' %}selected{% endif %}>Mes</option>
        <option value="year" {% if periodo=='year' %}selected{% endif %}>Año</option>
        <option value="custom" {% if periodo=='custom' %}selected{% endif %}>Personalizado</option>
      </select>
      <input type="date" name="fecha_desde" value="{{ fecha_desde or '' }}" class="form-control">
      <input type="date" name="fecha_hasta" value="{{ fecha_hasta or '' }}" class="form-control">
      <button class="btn btn-primary">Filtrar</button>
    </div>
  </form>

  <div id="gastos-table">
    {% include 'gastos/_table.html' %}
  </div>
{% endblock %}
