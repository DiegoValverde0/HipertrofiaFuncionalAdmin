{% extends 'base.html' %}

{% block title %}Auditoría{% endblock %}

{% block content %}
  <div class="max-w-7xl mx-auto space-y-6">
    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-6">
      <div class="flex items-start justify-between gap-4 flex-wrap">
        <div>
          <h2 class="text-2xl font-bold text-slate-900 tracking-tight flex items-center gap-3">
            <span class="w-10 h-10 rounded-xl bg-cyan-50 text-cyan-700 flex items-center justify-center">
              <i class="ti ti-shield-search text-2xl"></i>
            </span>
            Auditoría de Cambios
          </h2>
          <p class="text-sm text-slate-500 mt-1">Consulta trazabilidad por tabla, usuario y rango de fechas con detalle campo a campo.</p>
        </div>
        <div class="flex items-center gap-2">
          <button id="export-csv" class="h-9 inline-flex items-center justify-center rounded-lg border border-slate-200 bg-white hover:bg-slate-100 text-slate-700 px-3 text-sm font-medium transition-colors">
            <i class="ti ti-file-spreadsheet text-emerald-600 mr-1.5"></i> CSV
          </button>
          <button id="export-pdf" class="h-9 inline-flex items-center justify-center rounded-lg border border-slate-200 bg-white hover:bg-slate-100 text-slate-700 px-3 text-sm font-medium transition-colors">
            <i class="ti ti-file-type-pdf text-rose-600 mr-1.5"></i> PDF
          </button>
        </div>
      </div>
    </div>

    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-6 space-y-4">
      <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-6 gap-3">
        <div class="xl:col-span-2">
          <label for="f-tabla" class="text-sm font-medium text-slate-700 block mb-1">Tabla</label>
          <input id="f-tabla" class="h-10 w-full rounded-lg border border-slate-200 bg-white px-3 text-sm shadow-sm focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-cyan-500" placeholder="Ej: clientes, membresias">
        </div>
        <div>
          <label for="f-operacion" class="text-sm font-medium text-slate-700 block mb-1">Operación</label>
          <select id="f-operacion" class="h-10 w-full rounded-lg border border-slate-200 bg-white px-3 text-sm shadow-sm focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-cyan-500">
            <option value="">Todas</option>
            <option value="INSERT">INSERT</option>
            <option value="UPDATE">UPDATE</option>
            <option value="DELETE">DELETE</option>
          </select>
        </div>
        <div>
          <label for="f-usuario" class="text-sm font-medium text-slate-700 block mb-1">Usuario</label>
          <input id="f-usuario" list="usuarios-list" class="h-10 w-full rounded-lg border border-slate-200 bg-white px-3 text-sm shadow-sm focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-cyan-500" placeholder="Nombre del usuario">
          <input type="hidden" id="f-usuario-id">
          <datalist id="usuarios-list"></datalist>
        </div>
        <div>
          <label for="f-fecha-min" class="text-sm font-medium text-slate-700 block mb-1">Fecha desde</label>
          <input id="f-fecha-min" type="date" class="h-10 w-full rounded-lg border border-slate-200 bg-white px-3 text-sm shadow-sm focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-cyan-500">
        </div>
        <div>
          <label for="f-fecha-max" class="text-sm font-medium text-slate-700 block mb-1">Fecha hasta</label>
          <input id="f-fecha-max" type="date" class="h-10 w-full rounded-lg border border-slate-200 bg-white px-3 text-sm shadow-sm focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-cyan-500">
        </div>
      </div>

      <div class="flex flex-col sm:flex-row gap-3 sm:items-center sm:justify-between">
        <div class="relative flex-1">
          <i class="ti ti-search absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
          <input id="f-q" class="h-10 w-full rounded-lg border border-slate-200 bg-white pl-9 pr-3 text-sm shadow-sm focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-cyan-500" placeholder="Buscar texto dentro del detalle auditado...">
        </div>
        <div class="flex items-center gap-2">
          <label for="f-per-page" class="text-sm font-medium text-slate-700 whitespace-nowrap">Por página</label>
          <select id="f-per-page" class="h-10 rounded-lg border border-slate-200 bg-white px-3 text-sm shadow-sm focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-cyan-500">
            <option value="10">10</option>
            <option value="25" selected>25</option>
            <option value="50">50</option>
          </select>
        </div>
      </div>
    </div>

    <div id="auditoria-stats" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-3"></div>
    <div id="auditoria-results"></div>
  </div>

  <script>
    (function(){
      var tabla = document.getElementById('f-tabla');
      var oper = document.getElementById('f-operacion');
      var usuario = document.getElementById('f-usuario');
      var usuarioId = document.getElementById('f-usuario-id');
      var fmin = document.getElementById('f-fecha-min');
      var fmax = document.getElementById('f-fecha-max');
      var q = document.getElementById('f-q');
      var per = document.getElementById('f-per-page');
      var out = document.getElementById('auditoria-results');
      var statsEl = document.getElementById('auditoria-stats');
      var usuariosList = document.getElementById('usuarios-list');
      var exportCsv = document.getElementById('export-csv');
      var exportPdf = document.getElementById('export-pdf');

      var timer = null;
      var currentPage = 1;
      var lastParams = new URLSearchParams();

      function escapeHtml(value){
        return String(value == null ? '' : value)
          .replaceAll('&', '&amp;')
          .replaceAll('<', '&lt;')
          .replaceAll('>', '&gt;')
          .replaceAll('"', '&quot;')
          .replaceAll("'", '&#39;');
      }

      function fmtBolivia(iso){
        try {
          return new Date(iso).toLocaleString('es-BO', {
            timeZone: 'America/La_Paz',
            day: '2-digit',
            month: 'short',
            year: 'numeric',
            hour: '2-digit',
            minute: '2-digit',
            hour12: false,
          });
        } catch(e) {
          return iso || '';
        }
      }

      function formatValue(value){
        if (value === null || typeof value === 'undefined') {
          return '<span class="italic text-slate-400">null</span>';
        }
        if (typeof value === 'object') {
          return '<code class="text-xs bg-slate-100 px-1.5 py-1 rounded">' + escapeHtml(JSON.stringify(value)) + '</code>';
        }
        return escapeHtml(value);
      }

      function opBadge(op){
        var normalized = String(op || '').toUpperCase();
        if (normalized === 'INSERT') return 'bg-emerald-50 text-emerald-700 border border-emerald-200';
        if (normalized === 'UPDATE') return 'bg-amber-50 text-amber-700 border border-amber-200';
        if (normalized === 'DELETE') return 'bg-rose-50 text-rose-700 border border-rose-200';
        return 'bg-slate-100 text-slate-700 border border-slate-200';
      }

      function getParams(page){
        var params = new URLSearchParams();
        if (tabla && tabla.value) params.set('tabla', tabla.value.trim());
        if (oper && oper.value) params.set('operacion', oper.value);
        if (usuarioId && usuarioId.value) {
          params.set('usuario_id', usuarioId.value);
        } else if (usuario && usuario.value) {
          params.set('usuario_nombre', usuario.value.trim());
        }
        if (fmin && fmin.value) params.set('fecha_min', fmin.value);
        if (fmax && fmax.value) params.set('fecha_max', fmax.value);
        if (q && q.value) params.set('q', q.value.trim());
        if (per && per.value) params.set('per_page', per.value);
        params.set('page', page || 1);
        return params;
      }

      function renderStats(data){
        var stats = (data && data.stats) || {};
        var cards = [
          { label: 'Registros', value: data.total || 0, tone: 'slate', icon: 'ti ti-list-details' },
          { label: 'INSERT', value: stats.INSERT || 0, tone: 'emerald', icon: 'ti ti-circle-plus' },
          { label: 'UPDATE', value: stats.UPDATE || 0, tone: 'amber', icon: 'ti ti-refresh' },
          { label: 'DELETE', value: stats.DELETE || 0, tone: 'rose', icon: 'ti ti-trash' },
        ];

        var html = '';
        cards.forEach(function(card){
          var palette = {
            slate: 'bg-slate-50 text-slate-700 border-slate-200',
            emerald: 'bg-emerald-50 text-emerald-700 border-emerald-200',
            amber: 'bg-amber-50 text-amber-700 border-amber-200',
            rose: 'bg-rose-50 text-rose-700 border-rose-200',
          }[card.tone];

          html += '' +
            '<div class="rounded-xl border ' + palette + ' p-4 shadow-sm">' +
              '<div class="flex items-center justify-between">' +
                '<p class="text-xs font-semibold uppercase tracking-wide">' + escapeHtml(card.label) + '</p>' +
                '<i class="' + escapeHtml(card.icon) + '"></i>' +
              '</div>' +
              '<p class="text-2xl font-bold mt-2">' + escapeHtml(card.value) + '</p>' +
            '</div>';
        });
        statsEl.innerHTML = html;
      }

      function renderRows(items){
        if (!items || !items.length) {
          return '<tr><td colspan="7" class="px-4 py-8 text-center text-sm text-slate-500">No se encontraron registros con los filtros actuales.</td></tr>';
        }

        var html = '';
        items.forEach(function(it){
          var op = String(it.operacion || '').toUpperCase();
          var rowId = 'audit-detail-' + it.id;
          var userLabel = it.usuario || it.usuario_correo || (it.usuario_id ? ('Usuario #' + it.usuario_id) : 'Sistema');
          var detailCount = it.detalle_count || 0;
          var automaticTag = it.automatico ? '<span class="ml-2 text-[11px] px-2 py-0.5 rounded-full bg-slate-100 text-slate-600 border border-slate-200">Automático</span>' : '';
          var clientTag = '';
          if (it.cliente_ref && it.cliente_ref.id) {
            var clientName = it.cliente_ref.nombre ? (' - ' + it.cliente_ref.nombre) : '';
            clientTag = '<div class="mt-1 text-xs text-cyan-700 bg-cyan-50 border border-cyan-200 rounded-md px-2 py-1 inline-block">Cliente: #' +
              escapeHtml(it.cliente_ref.id) + escapeHtml(clientName) + '</div>';
          }

          html += '' +
            '<tr class="border-b border-slate-100 align-top">' +
              '<td class="px-4 py-3 text-sm text-slate-700 whitespace-nowrap">' + escapeHtml(fmtBolivia(it.fecha)) + '</td>' +
              '<td class="px-4 py-3 text-sm text-slate-700">' + escapeHtml(it.tabla || '-') + '</td>' +
              '<td class="px-4 py-3 text-xs text-slate-600"><code class="bg-slate-100 px-1.5 py-0.5 rounded">' + escapeHtml(it.pk_text || '-') + '</code></td>' +
              '<td class="px-4 py-3"><span class="text-xs font-semibold px-2 py-1 rounded-full ' + opBadge(op) + '">' + escapeHtml(op || '-') + '</span></td>' +
              '<td class="px-4 py-3 text-sm text-slate-700">' + escapeHtml(userLabel) + '</td>' +
              '<td class="px-4 py-3 text-sm text-slate-700">' + escapeHtml(it.resumen || '-') + automaticTag + clientTag + '</td>' +
              '<td class="px-4 py-3 text-right">' +
                '<button type="button" data-toggle="' + escapeHtml(rowId) + '" class="inline-flex items-center gap-1 text-cyan-700 hover:text-cyan-800 text-sm font-medium">' +
                  '<i class="ti ti-chevrons-down"></i> Ver detalle (' + escapeHtml(detailCount) + ')' +
                '</button>' +
              '</td>' +
            '</tr>';

          html += '<tr id="' + escapeHtml(rowId) + '" class="hidden bg-slate-50 border-b border-slate-100"><td colspan="7" class="px-4 py-3">';

          if (detailCount > 0) {
            html += '<div class="overflow-x-auto rounded-lg border border-slate-200 bg-white">';
            html += '<table class="min-w-full text-sm">';
            html += '<thead><tr class="bg-slate-50 text-slate-600 text-xs uppercase tracking-wide">';
            html += '<th class="px-3 py-2 text-left font-semibold">Campo</th>';
            html += '<th class="px-3 py-2 text-left font-semibold">Valor anterior</th>';
            html += '<th class="px-3 py-2 text-left font-semibold">Valor nuevo</th>';
            html += '</tr></thead><tbody>';

            (it.detalle_rows || []).forEach(function(row){
              var rowTone = row.es_pk ? 'bg-cyan-50/60' : '';
              var anteriorVal = (typeof row.anterior_display !== 'undefined') ? row.anterior_display : row.anterior;
              var nuevoVal = (typeof row.nuevo_display !== 'undefined') ? row.nuevo_display : row.nuevo;
              html += '<tr class="border-t border-slate-100 ' + rowTone + '">';
              html += '<td class="px-3 py-2 font-medium text-slate-700">' + escapeHtml(row.campo || '-') + '</td>';
              html += '<td class="px-3 py-2 text-slate-600">' + formatValue(anteriorVal) + '</td>';
              html += '<td class="px-3 py-2 text-slate-700">' + formatValue(nuevoVal) + '</td>';
              html += '</tr>';
            });

            html += '</tbody></table></div>';
          } else {
            html += '<p class="text-sm text-slate-500">Sin detalle estructurado. Descripción original:</p>';
            html += '<pre class="mt-2 text-xs text-slate-700 bg-white border border-slate-200 rounded-lg p-3 overflow-x-auto">' + escapeHtml(it.descripcion || '-') + '</pre>';
          }

          html += '</td></tr>';
        });
        return html;
      }

      function renderPagination(data){
        if (!data || !data.pages || data.pages <= 1) return '';

        var html = '<div class="mt-4 flex flex-col sm:flex-row gap-3 sm:items-center sm:justify-between">';
        html += '<p class="text-sm text-slate-600">Mostrando ' + escapeHtml(data.items.length) + ' de ' + escapeHtml(data.total) + ' registros</p>';
        html += '<div class="inline-flex items-center gap-1">';

        var start = Math.max(1, data.page - 3);
        var end = Math.min(data.pages, data.page + 3);

        if (data.page > 1) {
          html += '<button data-page="' + (data.page - 1) + '" class="px-3 h-9 rounded-lg border border-slate-200 bg-white text-sm hover:bg-slate-100">&laquo;</button>';
        }

        for (var i = start; i <= end; i++) {
          var active = i === data.page;
          html += '<button data-page="' + i + '" class="px-3 h-9 rounded-lg text-sm border ' +
            (active ? 'border-cyan-600 bg-cyan-600 text-white' : 'border-slate-200 bg-white text-slate-700 hover:bg-slate-100') + '">' + i + '</button>';
        }

        if (data.page < data.pages) {
          html += '<button data-page="' + (data.page + 1) + '" class="px-3 h-9 rounded-lg border border-slate-200 bg-white text-sm hover:bg-slate-100">&raquo;</button>';
        }

        html += '</div></div>';
        return html;
      }

      function renderTable(data){
        var html = '' +
          '<div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">' +
            '<div class="overflow-x-auto">' +
              '<table class="min-w-full">' +
                '<thead class="bg-slate-50 border-b border-slate-200">' +
                  '<tr class="text-xs uppercase tracking-wide text-slate-600">' +
                    '<th class="px-4 py-3 text-left font-semibold">Fecha</th>' +
                    '<th class="px-4 py-3 text-left font-semibold">Tabla</th>' +
                    '<th class="px-4 py-3 text-left font-semibold">PK</th>' +
                    '<th class="px-4 py-3 text-left font-semibold">Operación</th>' +
                    '<th class="px-4 py-3 text-left font-semibold">Usuario</th>' +
                    '<th class="px-4 py-3 text-left font-semibold">Resumen</th>' +
                    '<th class="px-4 py-3 text-right font-semibold">Acciones</th>' +
                  '</tr>' +
                '</thead>' +
                '<tbody>' + renderRows(data.items || []) + '</tbody>' +
              '</table>' +
            '</div>' +
          '</div>';

        html += renderPagination(data);
        out.innerHTML = html;
      }

      function load(page){
        currentPage = page || 1;
        var params = getParams(currentPage);
        lastParams = new URLSearchParams(params);

        fetch('/auditoria/search?' + params.toString(), { credentials: 'same-origin' })
          .then(function(r){ return r.json(); })
          .then(function(data){
            renderStats(data);
            renderTable(data);
          })
          .catch(function(err){
            out.innerHTML = '<div class="bg-rose-50 border border-rose-200 text-rose-700 rounded-xl p-4 text-sm">Error cargando auditoría</div>';
            statsEl.innerHTML = '';
            console.error(err);
          });
      }

      function scheduleLoad(resetPage){
        clearTimeout(timer);
        timer = setTimeout(function(){
          if (resetPage) currentPage = 1;
          load(currentPage || 1);
        }, 250);
      }

      function resolveSelectedUserId(){
        var val = (usuario && usuario.value) || '';
        var opts = usuariosList.querySelectorAll('option') || [];
        var found = null;
        for (var i = 0; i < opts.length; i++) {
          if (opts[i].value === val) {
            found = opts[i];
            break;
          }
        }
        usuarioId.value = found ? (found.getAttribute('data-id') || '') : '';
      }

      fetch('/auditoria/users', { credentials: 'same-origin' })
        .then(function(r){ return r.json(); })
        .then(function(users){
          usuariosList.innerHTML = '';
          users.forEach(function(u){
            var opt = document.createElement('option');
            opt.value = u.nombre;
            opt.setAttribute('data-id', u.id);
            usuariosList.appendChild(opt);
          });
        })
        .catch(function(){ /* ignore */ });

      [tabla, oper, fmin, fmax, q].forEach(function(el){
        if (!el) return;
        el.addEventListener('input', function(){ scheduleLoad(true); });
        el.addEventListener('change', function(){ scheduleLoad(true); });
      });

      if (usuario) {
        usuario.addEventListener('input', function(){
          usuarioId.value = '';
          scheduleLoad(true);
        });
        usuario.addEventListener('change', function(){
          resolveSelectedUserId();
          scheduleLoad(true);
        });
      }

      if (per) {
        per.addEventListener('change', function(){
          currentPage = 1;
          load(1);
        });
      }

      out.addEventListener('click', function(e){
        var btnPage = e.target.closest('button[data-page]');
        if (btnPage) {
          e.preventDefault();
          var p = parseInt(btnPage.getAttribute('data-page'), 10) || 1;
          load(p);
          return;
        }

        var btnToggle = e.target.closest('button[data-toggle]');
        if (btnToggle) {
          e.preventDefault();
          var targetId = btnToggle.getAttribute('data-toggle');
          var row = targetId ? document.getElementById(targetId) : null;
          if (!row) return;
          row.classList.toggle('hidden');
        }
      });

      if (exportCsv) {
        exportCsv.addEventListener('click', function(){
          var qparams = new URLSearchParams(lastParams);
          qparams.delete('page');
          window.location = '/auditoria/export?' + qparams.toString();
        });
      }

      if (exportPdf) {
        exportPdf.addEventListener('click', function(){
          alert('Exportar PDF no implementado, se descargará CSV');
          var qparams = new URLSearchParams(lastParams);
          qparams.delete('page');
          window.location = '/auditoria/export?' + qparams.toString();
        });
      }

      load(1);
    })();
  </script>

{% endblock %}
