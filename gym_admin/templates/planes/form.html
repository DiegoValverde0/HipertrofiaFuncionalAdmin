{% extends 'base.html' %}

{% block title %}Plan{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto space-y-6">
  <!-- Header -->
  <div>
    <h2 class="text-2xl font-bold text-slate-900 tracking-tight">{{ 'Editar' if plan else 'Crear' }} Plan</h2>
    <p class="text-sm text-slate-500 mt-1">Configura las características y el precio de este plan de membresía.</p>
  </div>

  <!-- Form Card -->
  <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
    <form method="post" class="confirm-edit p-6 sm:p-8 space-y-8">
      {% if plan %}<input type="hidden" name="id" value="{{ plan.id }}">{% endif %}

      <div class="space-y-6">
        <h3 class="text-lg font-semibold text-slate-900 border-b border-slate-100 pb-2">Información Principal</h3>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div class="col-span-1 md:col-span-2">
            <label class="block text-sm font-medium text-slate-700 mb-1.5">Nombre del Plan</label>
            <input class="block w-full rounded-xl border-slate-200 text-sm focus:border-brand-500 focus:ring-brand-500 transition-colors h-11 px-4 bg-slate-50 hover:bg-white" 
                   name="nombre" 
                   value="{{ plan.nombre if plan else '' }}" 
                   placeholder="Ej. Plan Anual Vip" 
                   required>
          </div>

          <div class="col-span-1 md:col-span-2">
            <label class="block text-sm font-medium text-slate-700 mb-1.5">Descripción</label>
            <textarea class="block w-full rounded-xl border-slate-200 text-sm focus:border-brand-500 focus:ring-brand-500 transition-colors px-4 py-3 bg-slate-50 hover:bg-white" 
                      name="descripcion" 
                      rows="3" 
                      placeholder="Beneficios y detalles del plan (opcional)">{{ plan.descripcion if plan else '' }}</textarea>
          </div>
        </div>
      </div>

      <div class="space-y-6 pt-2">
        <h3 class="text-lg font-semibold text-slate-900 border-b border-slate-100 pb-2">Configuración Comercial</h3>
        
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1.5">Duración</label>
            <select class="block w-full rounded-xl border-slate-200 text-sm focus:border-brand-500 focus:ring-brand-500 transition-colors h-11 px-4 bg-slate-50 hover:bg-white" 
                    name="duracion">
              {% for opt in ['Mensual','Trimestral','Semestral','Anual'] %}
                <option value="{{ opt }}" {% if plan and plan.duracion==opt %}selected{% endif %}>{{ opt }}</option>
              {% endfor %}
            </select>
          </div>

          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1.5">  Modalidad</label>
            <select class="block w-full rounded-xl border-slate-200 text-sm focus:border-brand-500 focus:ring-brand-500 transition-colors h-11 px-4 bg-slate-50 hover:bg-white" 
                    name="tipo">
              {% for t in ['Individual','Familiar','Corporativo'] %}
                <option value="{{ t }}" {% if plan and plan.tipo==t %}selected{% endif %}>{{ t }}</option>
              {% endfor %}
            </select>
          </div>

          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1.5">Precio (S/)</label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
                <span class="text-slate-400 sm:text-sm font-medium">S/</span>
              </div>
              <input class="block w-full pl-9 rounded-xl border-slate-200 text-sm focus:border-brand-500 focus:ring-brand-500 transition-colors h-11 bg-slate-50 hover:bg-white" 
                     name="precio" 
                     value="{{ plan.precio if plan else '' }}" 
                     type="number" 
                     step="0.01" 
                     placeholder="0.00" 
                     required>
            </div>
          </div>

          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1.5">Estado</label>
            <select class="block w-full rounded-xl border-slate-200 text-sm focus:border-brand-500 focus:ring-brand-500 transition-colors h-11 px-4 bg-slate-50 hover:bg-white font-medium {{ 'text-green-700' if not plan or plan.estado == 'Activo' else 'text-slate-600' }}" 
                    name="estado">
              <option value="Activo" {% if plan and plan.estado=='Activo' %}selected{% endif %}>Activo</option>
              <option value="Inactivo" {% if plan and plan.estado=='Inactivo' %}selected{% endif %}>Inactivo</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Actions -->
      <div class="flex items-center justify-end gap-3 pt-6 border-t border-slate-100">
        <a href="{{ url_for('planes.list_planes') }}" class="inline-flex items-center justify-center rounded-xl text-sm font-medium transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-slate-500 border border-slate-200 bg-white text-slate-700 hover:bg-slate-50 h-10 px-5">
          Cancelar
        </a>
        <button type="submit" class="inline-flex items-center justify-center rounded-xl text-sm font-medium transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand-500 bg-brand-600 text-white hover:bg-brand-700 h-10 px-5 shadow-sm">
          <i class="ti ti-device-floppy mr-2 text-lg"></i>
          Guardar Plan
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
